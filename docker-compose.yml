services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: proarena
      POSTGRES_USER: proarena
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proarena -d proarena"]
      interval: 5s
      timeout: 3s
      retries: 10
  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://database:5432/proarena
      DATABASE_USERNAME: proarena
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-localdev}
      JWT_SECRET: ${JWT_SECRET:-local-development-secret-change-this-before-deploying-123456}
      FRONTEND_ORIGIN: http://localhost:5173
    ports:
      - "8080:8080"
    depends_on:
      database:
        condition: service_healthy
volumes:
  postgres-data:
